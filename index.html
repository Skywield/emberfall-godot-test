<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Emberfall</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0d080f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>body{background:#0d070f}</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14058092,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
		window.efStarted = true; var l=document.getElementById('ef-load'); if(l) l.style.display='none';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (window.efLoadMsg) window.efLoadMsg(current, total);
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.efStarted = true;
		}, displayFailureNotice);
	}
}());
		</script>
	
<div id="ef-load" style="position:absolute;left:0;right:0;bottom:calc(10% + 28px);text-align:center;font:15px/1.4 system-ui,sans-serif;color:#f3d9b1;z-index:5;pointer-events:none;text-shadow:0 1px 2px #000">
  <div style="font-size:22px;letter-spacing:.08em;color:#ffb35c;margin-bottom:6px">EMBERFALL</div>
  <div id="ef-load-msg">Loading…</div>
  <div id="ef-load-hint" style="font-size:12px;color:#c9a98a;max-width:520px;margin:6px auto 0"></div>
</div>
<script>
(function () {
  var msg = document.getElementById('ef-load-msg'), hint = document.getElementById('ef-load-hint'), box = document.getElementById('ef-load');
  var EF_DL_MB = 22.9;
  var t0 = performance.now(), last = t0, lastBytes = 0, downloaded = false;
  window.efLoadMsg = function (cur, tot) {
    if (cur !== lastBytes) { lastBytes = cur; last = performance.now(); }
    var f = cur / tot, pct = Math.floor(f * 100);
    msg.textContent = 'Downloading… ' + pct + '%  (' + (f * EF_DL_MB).toFixed(1) + ' / ' + EF_DL_MB.toFixed(1) + ' MB)';
    if (cur >= tot && !downloaded) { downloaded = true; last = performance.now(); msg.textContent = 'Starting engine…'; }
  };
  // Software-rendered WebGL (no GPU) is very slow: warn up front.
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2', { failIfMajorPerformanceCaveat: true });
    if (!gl && c.getContext('webgl2')) hint.textContent = 'Note: this browser is rendering WebGL2 without GPU acceleration, so startup may be slow.';
  } catch (e) {}
  var iv = setInterval(function () {
    if (window.efStarted) { clearInterval(iv); box.style.display = 'none'; return; }
    var idle = (performance.now() - last) / 1000, total = (performance.now() - t0) / 1000;
    if (downloaded && idle > 20) hint.textContent = 'Still starting after ' + Math.round(total) + ' s. This browser may lack hardware-accelerated WebGL2 — try desktop Chrome, Edge or Firefox with hardware acceleration on.';
    else if (!downloaded && idle > 15) hint.textContent = 'Download stalled for ' + Math.round(idle) + ' s — check the connection, or reload the page.';
  }, 1000);
})();
</script>
</body>
</html>
